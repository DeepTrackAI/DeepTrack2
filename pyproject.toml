[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "deeptrack/benchmarks",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff]
line-length = 79

[tool.black]
line-length = 79
