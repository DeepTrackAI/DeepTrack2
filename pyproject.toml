[project]
name = "deeptrack"
version = "2.0.1"
description = "A deep learning framework to enhance microscopy, developed by DeepTrackAI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff]
line-length = 79
